<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>多彩海蛞蝓 — 手办工坊</title>
<script type="module">
import {ModelViewerElement} from './lib/model-viewer.min.js';
ModelViewerElement.dracoDecoderLocation = './lib/';
</script>
<style>
 :root{--bg:#f7f6f3;--card:#fff;--ink:#20263a;--sub:#70747f;--line:#e7e4dc;--navy:#1e2f4d;--brass:#a8834b;--cream:#f3ead9}
 *{box-sizing:border-box}
 body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
 a{text-decoration:none;color:inherit}
 .topbar{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:16px;padding:13px 30px;background:rgba(30,47,77,.97);color:#f5f2ea;backdrop-filter:blur(6px)}
 .brand{font-size:18px;font-weight:600;letter-spacing:3px}
 .brand b{color:#d8b878}
 .topbar .sp{flex:1}

 .stage{display:flex;flex-direction:column;height:calc(100dvh - 50px)}
 .head{display:flex;align-items:baseline;gap:14px;padding:15px 30px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
 .head h1{font-size:21px;margin:0;font-weight:600}
 .head .sci{color:var(--sub);font-size:14px;font-style:italic}
 .stagewrap{flex:1;display:flex;min-height:0}
 .side{width:310px;background:var(--card);border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
 .side .lab{font-size:12px;letter-spacing:2px;color:var(--brass);font-weight:600}
 .side img{width:100%;border-radius:12px;border:1px solid var(--line);object-fit:cover}
 .side .note{font-size:12.5px;color:var(--sub);line-height:1.65}
 .side .note a{color:var(--brass)}
 model-viewer{flex:1;height:100%;background:linear-gradient(175deg,#eef0f2,#dcd9d2);--poster-color:transparent}
 @media(max-width:760px){.stagewrap{flex-direction:column}.side{width:100%;border-right:none;border-bottom:1px solid var(--line);flex-direction:row;align-items:center;padding:12px}.side img{width:110px}}
 .nav{display:flex;justify-content:space-between;padding:12px 30px;background:var(--card);border-top:1px solid var(--line);font-size:14px}
 .nav a:hover{color:var(--brass)}
 @media(max-width:640px){.head{padding:12px 16px}.nav{padding:10px 16px}}
</style></head><body>
<div class="topbar"><a href="index.html"><span class="brand"><b>手办</b>工坊</span></a></div>
<div class="stage">
 <div class="head"><h1>多彩海蛞蝓</h1><span class="sci">Chromodoris quadricolor</span></div>
 <div class="stagewrap">
  <div class="side"><div class="lab">参 考 照 片</div><img src="img/nudi_ref.jpg" alt="参考照片"><div class="note">三色高对比，最能体现全彩树脂的色块锐度</div><div class="note" style="margin-top:auto;padding-top:10px;border-top:1px solid var(--line)">照片：Matt Kieffer<br>授权：CC BY-SA 2.0　<a href="https://commons.wikimedia.org/wiki/File%3AChromodoris%20quadricolor%2C%20Sharm%20el%20Sheikh.jpg" target="_blank" rel="noopener">来源 ↗</a><br>摆件造型为艺术化再创作</div></div>
  <model-viewer src="models/nudi.glb" poster="img/nudi.png" camera-controls auto-rotate auto-rotate-delay="800" shadow-intensity="1.2" exposure="0.9" loading="eager"></model-viewer>
 </div>
 <div class="nav"><a href="beagle_real.html">← 上一件</a><a href="index.html">全部作品</a><a href="cuttle.html">下一件 →</a></div>
</div>
</body></html>
